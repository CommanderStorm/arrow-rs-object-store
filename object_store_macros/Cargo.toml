[package]
name = "object_store_macros"
version = "0.13.2"
edition = "2024"
license = "MIT/Apache-2.0"
description = "Internal proc-macro derives for the object_store crate. Not intended for direct use."
repository = "https://github.com/apache/arrow-rs-object-store"
rust-version = "1.85"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[dev-dependencies]
trybuild = "1"
